name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Build debug APK
        working-directory: android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log
      - name: Publish build log on failure
        if: failure()
        run: |
          mkdir /tmp/lg && tail -n 120 /tmp/build.log > /tmp/lg/build.log && cd /tmp/lg && git init -q -b build-log
          git config user.name github-actions && git config user.email actions@github.com
          git add . && git commit -qm log && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" build-log
      - uses: actions/upload-artifact@v4
        with:
          name: SpendTracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to the apk-build branch
        run: |
          mkdir /tmp/out && cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/out/SpendTracker.apk
          cd /tmp/out && git init -q -b apk-build
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add . && git commit -qm "Built APK"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk-build
